[package]
name = "glow-agent"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust agent runtime with streaming, tools, handoffs, and host-owned tasks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/42tr/g"
readme = "README.md"
keywords = ["agent", "llm", "tools", "mcp", "async"]
categories = ["asynchronous", "api-bindings"]
publish = ["crates-io"]

[features]
default = []
mcp = ["dep:rmcp", "dep:sha2", "tokio/process"]
skills = ["dep:sha2", "dep:serde_yaml"]

[dependencies]
async-trait = "0.1"
eventsource-stream = "0.2"
futures-util = "0.3"
glow-agent-macros = { path = "g-macros", version = "=0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = { version = "0.10", optional = true }
serde_yaml = { version = "0.9", optional = true }
jsonschema = { version = "0.33", default-features = false }
rmcp = { version = "3.3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"], optional = true }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["g-macros"]

[[example]]
name = "extensions"
required-features = ["mcp", "skills"]
